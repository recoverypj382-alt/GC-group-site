<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PJ GAMING - FREE FIRE SKIN TOOLS GIVEAWAY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .card {
      background: #151c32;
      border-radius: 22px;
      padding: 28px 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    .brand {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #b9c1d9;
      line-height: 1.5;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .gift {
      font-size: 65px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      margin: 8px 0;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      margin-top: 12px;
      background: #25d366;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }

    button:active {
      transform: scale(.98);
    }

    .progress {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .bar {
      height: 14px;
      background: #303952;
      border-radius: 20px;
      margin: 12px 0 20px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: #25d366;
      transition: .4s;
    }

    .share-link {
      background: #0d1428;
      padding: 14px;
      border-radius: 12px;
      margin-top: 15px;
      word-break: break-all;
      color: #b9c1d9;
      font-size: 14px;
    }

    .note {
      margin-top: 22px;
      color: #8f98b3;
      font-size: 13px;
      line-height: 1.5;
      text-transform: uppercase;
    }

    footer {
      margin-top: 20px;
      color: #707991;
      font-size: 12px;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="gift">🎁</div>

      <div class="brand">
        PJ GAMING
      </div>

      <div class="title">
        FREE FIRE SKIN TOOLS GIVEAWAY
      </div>

      <p class="subtitle">
        ENTER YOUR DETAILS AND INVITE YOUR FRIENDS.
        GET 10 VERIFIED REFERRALS TO BECOME ELIGIBLE
        FOR YOUR FREE FIRE SKIN TOOLS.
      </p>

      <input
        id="name"
        type="text"
        placeholder="ENTER YOUR NAME"
      >

      <input
        id="phone"
        type="tel"
        placeholder="ENTER YOUR WHATSAPP NUMBER"
      >

      <button onclick="startGiveaway()">
        ENTER GIVEAWAY
      </button>

      <div id="result" style="display:none;">

        <div class="progress">
          REFERRALS: <span id="count">0</span>/10
        </div>

        <div class="bar">
          <div class="fill" id="fill"></div>
        </div>

        <button onclick="shareWhatsApp()">
          SHARE ON WHATSAPP
        </button>

        <div class="share-link" id="shareLink"></div>

        <p class="note">
          YOUR GIFT BECOMES AVAILABLE AFTER YOU REACH
          10 VERIFIED REFERRALS.
        </p>

      </div>

      <footer>
        © 2026 PJ GAMING | FREE FIRE SKIN TOOLS GIVEAWAY
      </footer>

    </div>

  </div>

<script>

function startGiveaway() {

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  if (!name || !phone) {
    alert("PLEASE ENTER YOUR NAME AND WHATSAPP NUMBER.");
    return;
  }

  let code =
    localStorage.getItem("referralCode");

  if (!code) {

    code =
      Math.random()
      .toString(36)
      .substring(2, 10);

    localStorage.setItem(
      "referralCode",
      code
    );
  }

  const link =
    window.location.origin +
    window.location.pathname +
    "?ref=" + code;

  document.getElementById(
    "shareLink"
  ).textContent = link;

  document.getElementById(
    "result"
  ).style.display = "block";

  updateProgress();
}

function updateProgress() {

  let referrals =
    parseInt(
      localStorage.getItem("referrals") || "0"
    );

  document.getElementById(
    "count"
  ).textContent = referrals;

  document.getElementById(
    "fill"
  ).style.width =
    Math.min(referrals * 10, 100) + "%";

  if (referrals >= 10) {

    alert(
      "CONGRATULATIONS! YOU HAVE REACHED 10 REFERRALS!"
    );

  }
}

function shareWhatsApp() {

  const link =
    document.getElementById(
      "shareLink"
    ).textContent;

  const message =
    "🎁 PJ GAMING 🎁\n\n" +
    "FREE FIRE SKIN TOOLS GIVEAWAY!\n\n" +
    "JOIN THE GIVEAWAY USING MY REFERRAL LINK:\n" +
    link;

  const whatsapp =
    "https://wa.me/?text=" +
    encodeURIComponent(message);

  window.open(
    whatsapp,
    "_blank"
  );
}

</script>

</body>
</html>
